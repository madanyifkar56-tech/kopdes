name: kopdes

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kopdes-app:latest
    container_name: kopdes-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=local
      - CONTAINER_ROLE=app
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kopdes-net

  queue:
    image: kopdes-app:latest
    container_name: kopdes-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kopdes-net

  reverb:
    image: kopdes-app:latest
    container_name: kopdes-reverb
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kopdes-net

  webserver:
    image: nginx:1.27-alpine
    container_name: kopdes-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - kopdes-net

  mariadb:
    image: mariadb:11
    container_name: kopdes-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: kopdes
      MARIADB_USER: kopdes
      MARIADB_PASSWORD: kopdes
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - kopdes-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - kopdes-net

  mariadb-testing:
    image: mariadb:11
    container_name: kopdes-mariadb-testing
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: kopdes_testing
      MARIADB_USER: kopdes
      MARIADB_PASSWORD: kopdes
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - kopdes-mariadb-testing-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - kopdes-net

  redis:
    image: redis:7-alpine
    container_name: kopdes-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kopdes-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kopdes-net

networks:
  kopdes-net:
    driver: bridge

volumes:
  kopdes-mariadb-data:
  kopdes-mariadb-testing-data:
  kopdes-redis-data:
